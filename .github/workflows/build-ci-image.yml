name: Build CI Image

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=ghcr.io/rophy/testing-library-docs:ci-${SHORT_SHA}
          docker build -t ${IMAGE} .
          docker push ${IMAGE}
          echo "Pushed ${IMAGE}"
