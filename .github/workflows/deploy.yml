name: Deploy KMS Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: cd plugins/docusaurus-plugin-kms-sync && npm ci
      - run: cd kms-mock-server && npm ci

      - name: Start mock KMS server
        run: docker compose up -d

      - name: Wait for KMS server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3001/api/v1/pages > /dev/null && break
            sleep 1
          done

      - name: Build and sync to KMS
        run: npm run build

      - name: Generate static site from KMS pages
        run: node kms-mock-server/generate-static.js kms-preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kms-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
