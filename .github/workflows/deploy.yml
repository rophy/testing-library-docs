name: Deploy KMS Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rophy/testing-library-docs:ci-02d93a0
    steps:
      - uses: actions/checkout@v4

      - name: Link pre-installed dependencies
        run: |
          ln -s /deps/root/node_modules ./node_modules
          ln -s /deps/plugin/node_modules ./plugins/docusaurus-plugin-kms-sync/node_modules
          ln -s /deps/kms-mock/node_modules ./kms-mock-server/node_modules

      - name: Start mock KMS server
        run: node kms-mock-server/server.js &

      - name: Wait for KMS server
        run: |
          for i in $(seq 1 30); do
            wget -q -O /dev/null http://localhost:3001/api/v1/pages && break
            sleep 1
          done

      - name: Build and sync to KMS
        run: npm run build

      - name: Generate static site from KMS pages
        run: node kms-mock-server/generate-static.js kms-preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kms-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
